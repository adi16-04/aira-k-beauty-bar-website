<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aria k Services QR</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #fff9f5;
        font-family: Jost, Arial, sans-serif;
      }
      main {
        width: min(92vw, 760px);
        text-align: center;
      }
      section {
        display: grid;
        grid-template-columns: repeat(2, minmax(260px, 1fr));
        gap: 18px;
      }
      article {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(214,181,108,0.24);
        padding: 20px;
      }
      img {
        width: min(64vw, 280px);
        height: min(64vw, 280px);
        background: #fff;
        padding: 16px;
      }
      h1 {
        margin: 0 0 24px;
        color: #d6b56c;
        font-family: Georgia, serif;
        font-size: 34px;
      }
      h2 {
        margin: 0 0 14px;
        color: #fff9f5;
        font-family: Georgia, serif;
        font-size: 26px;
      }
      p {
        margin: 0 0 20px;
        color: rgba(255,249,245,0.68);
        line-height: 1.5;
      }
      a {
        color: #0a0a0a;
        background: #d6b56c;
        display: inline-block;
        padding: 12px 18px;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      @media (max-width: 640px) {
        section {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aria k Services QR</h1>
      <section>
        <article>
          <h2>Female Menu</h2>
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=640x640&margin=24&data=https%3A%2F%2Fwww.airakbeautybar.com%2F%23female-services"
            alt="QR code for Aria k Beauty Bar female services menu"
          />
          <p>Scan to open https://www.airakbeautybar.com/#female-services</p>
          <a
            href="https://api.qrserver.com/v1/create-qr-code/?size=640x640&margin=24&data=https%3A%2F%2Fwww.airakbeautybar.com%2F%23female-services"
            download="airak-female-services-qr.png"
          >
            Download QR
          </a>
        </article>
        <article>
          <h2>Men Menu</h2>
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=640x640&margin=24&data=https%3A%2F%2Fwww.airakbeautybar.com%2F%23men-services"
            alt="QR code for Aria k Beauty Bar men services menu"
          />
          <p>Scan to open https://www.airakbeautybar.com/#men-services</p>
          <a
            href="https://api.qrserver.com/v1/create-qr-code/?size=640x640&margin=24&data=https%3A%2F%2Fwww.airakbeautybar.com%2F%23men-services"
            download="airak-men-services-qr.png"
          >
            Download QR
          </a>
        </article>
      </section>
    </main>
  </body>
</html>
